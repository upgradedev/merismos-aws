[project]
name = "merismos"
version = "0.1.0"
description = "A fleet of institutional agents for groups that cannot afford one"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.53.0",
    "boto3>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The floor is enforced, not reported. A number in a badge that nothing checks
# drifts down one commit at a time and nobody is the one who broke it.
addopts = "--cov=merismos --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ISC"]
