<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Merismos production architecture on AWS</title>
  <desc id="desc">CloudFront serves the React application from private S3 and forwards API requests to API Gateway. The reader Lambda runs sandbox Strands agents with a scripted model and stores sessions in DynamoDB. Live runner calls Amazon Bedrock only through an authorised internal proof path. A separate writer Lambda spends an exact approval before publishing a record to S3. The public API has no authorizer, so live writes are refused.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#71decd"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#72809c"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="24" fill="#0b0f1e"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="54" y="63" font-size="32" font-weight="700" fill="#e8ebf5">Merismos on AWS</text>
    <text x="54" y="96" font-size="19" fill="#aab2c8">Public sandbox path, private live path and the exact human approval boundary</text>

    <rect x="50" y="146" width="180" height="86" rx="14" fill="#182043" stroke="#71decd" stroke-width="2"/>
    <text x="140" y="182" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">Coordinator</text>
    <text x="140" y="210" text-anchor="middle" font-size="18" fill="#aab2c8">browser</text>

    <rect x="300" y="146" width="190" height="86" rx="14" fill="#153e42" stroke="#71decd" stroke-width="2"/>
    <text x="395" y="182" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">CloudFront</text>
    <text x="395" y="210" text-anchor="middle" font-size="18" fill="#aab2c8">app and API edge</text>

    <rect x="560" y="146" width="210" height="86" rx="14" fill="#153e42" stroke="#71decd" stroke-width="2"/>
    <text x="665" y="182" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">API Gateway</text>
    <text x="665" y="210" text-anchor="middle" font-size="18" fill="#f3ce86">no authorizer deployed</text>

    <rect x="840" y="146" width="250" height="86" rx="14" fill="#37251f" stroke="#f3ce86" stroke-width="2"/>
    <text x="965" y="182" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">Reader Lambda</text>
    <text x="965" y="210" text-anchor="middle" font-size="18" fill="#aab2c8">API and sandbox Strands loop</text>

    <path d="M230 189 H292" stroke="#71decd" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M490 189 H552" stroke="#71decd" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M770 189 H832" stroke="#71decd" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="842" y="298" width="246" height="86" rx="14" fill="#182043" stroke="#72809c" stroke-width="2"/>
    <text x="965" y="334" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">DynamoDB</text>
    <text x="965" y="362" text-anchor="middle" font-size="18" fill="#aab2c8">sessions, runs, approvals</text>
    <path d="M965 232 V290" stroke="#71decd" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="462" y="456" width="224" height="92" rx="14" fill="#37251f" stroke="#f3ce86" stroke-width="2"/>
    <text x="574" y="493" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">Runner Lambda</text>
    <text x="574" y="521" text-anchor="middle" font-size="18" fill="#aab2c8">authorised live proof only</text>

    <rect x="748" y="456" width="224" height="92" rx="14" fill="#3b1631" stroke="#e06cb6" stroke-width="2"/>
    <text x="860" y="493" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">Amazon Bedrock</text>
    <text x="860" y="521" text-anchor="middle" font-size="18" fill="#aab2c8">live runs only</text>
    <path d="M686 502 H740" stroke="#e06cb6" stroke-width="3" marker-end="url(#arrow-muted)"/>

    <rect x="50" y="456" width="250" height="92" rx="14" fill="#37251f" stroke="#f3ce86" stroke-width="2"/>
    <text x="175" y="493" text-anchor="middle" font-size="21" font-weight="650" fill="#e8ebf5">Writer Lambda</text>
    <text x="175" y="521" text-anchor="middle" font-size="18" fill="#aab2c8">spends exact approval</text>

    <rect x="50" y="586" width="250" height="62" rx="14" fill="#182043" stroke="#72809c" stroke-width="2"/>
    <text x="175" y="624" text-anchor="middle" font-size="19" fill="#e8ebf5">Public S3 records</text>
    <path d="M175 548 V578" stroke="#71decd" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M840 198 H780 V430 H175 V448" fill="none" stroke="#72809c" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow-muted)"/>
    <text x="500" y="405" text-anchor="middle" font-size="18" fill="#aab2c8">private IAM-only live paths; refused on the public API</text>
    <path d="M840 218 H805 V418 H574 V448" fill="none" stroke="#72809c" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow-muted)"/>

    <rect x="50" y="276" width="650" height="98" rx="14" fill="#11182b" stroke="#2c3857"/>
    <text x="76" y="310" font-size="20" font-weight="650" fill="#71decd">Public sandbox</text>
    <text x="76" y="340" font-size="18" fill="#e8ebf5">Real HTTP API and Strands SDK loop with a fixed scripted planner.</text>
    <text x="76" y="365" font-size="18" fill="#aab2c8">No model network call, no public record and no automatic message.</text>
  </g>
</svg>
