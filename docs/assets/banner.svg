<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Merismos: one synthetic donation, checked allocation, simulated collection confirmation</title>
  <desc id="desc">A three-step summary. A coordinator adds a synthetic food offer. Rules and eligible Strands agents check the offer and propose a bounded split. A person approves the exact plan and separately records a simulated collection confirmation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#153e42"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#background)" stroke="#3c746e" stroke-width="2"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <circle cx="64" cy="68" r="25" fill="#71decd"/>
    <text x="64" y="77" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#0c2527">μ</text>
    <text x="105" y="60" font-size="31" font-weight="700" fill="#e8ebf5">Merismos</text>
    <text x="105" y="89" font-size="20" fill="#aab2c8">A reasoned allocation and its collection handoff, kept together</text>

    <path d="M420 224 H449" stroke="#71decd" stroke-width="3" stroke-linecap="round"/>
    <path d="M441 216 L449 224 L441 232" fill="none" stroke="#71decd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M831 224 H860" stroke="#71decd" stroke-width="3" stroke-linecap="round"/>
    <path d="M852 216 L860 224 L852 232" fill="none" stroke="#71decd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="154" width="360" height="126" rx="16" fill="#141a2e" stroke="#3c746e"/>
      <rect x="460" y="154" width="360" height="126" rx="16" fill="#141a2e" stroke="#3c746e"/>
      <rect x="872" y="154" width="360" height="126" rx="16" fill="#141a2e" stroke="#3c746e"/>
    </g>

    <circle cx="82" cy="154" r="17" fill="#71decd" stroke="#0b0f1e" stroke-width="2"/>
    <circle cx="494" cy="154" r="17" fill="#71decd" stroke="#0b0f1e" stroke-width="2"/>
    <circle cx="906" cy="154" r="17" fill="#71decd" stroke="#0b0f1e" stroke-width="2"/>
    <text x="82" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#0c2527">1</text>
    <text x="494" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#0c2527">2</text>
    <text x="906" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#0c2527">3</text>

    <text x="78" y="205" font-size="24" font-weight="650" fill="#e8ebf5">Add an offer</text>
    <text x="78" y="238" font-size="18" fill="#aab2c8">Synthetic food, dates and constraints</text>
    <text x="78" y="264" font-size="18" fill="#aab2c8">Personal data is refused at intake</text>

    <text x="490" y="205" font-size="24" font-weight="650" fill="#e8ebf5">Check and propose</text>
    <text x="490" y="238" font-size="18" fill="#aab2c8">Rules first, Strands when eligible</text>
    <text x="490" y="264" font-size="18" fill="#aab2c8">Every share keeps its reason</text>

    <text x="902" y="205" font-size="24" font-weight="650" fill="#e8ebf5">Approve, then confirm</text>
    <text x="902" y="238" font-size="18" fill="#aab2c8">Exact plan approval by a person</text>
    <text x="902" y="264" font-size="18" fill="#aab2c8">Collection confirmation is simulated</text>
  </g>
</svg>
