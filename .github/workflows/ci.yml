name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      eval_grant_sha256:
        description: "Parent-configured one-shot grant digest; empty runs SOURCE ONLY"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.eval_grant_sha256 != '' && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.eval_grant_sha256 == '' }}

jobs:
  # The secret scan runs first and over history, not over the working tree. A
  # credential repaired in the tree but left in a commit is still published, and
  # a discovered secret requires incident review, never silent history deletion.
  # One immutable fingerprint is a reviewed socket-denied synthetic fixture.
  # No file, rule or key pattern is excluded; the contract rejects broader ignores.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads the PR commit list in private repositories.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over every fetched branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/merismos-gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks --dir /tmp/merismos-gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt
          (cd /tmp/merismos-gitleaks && grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -)
          tar -xzf /tmp/merismos-gitleaks/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp/merismos-gitleaks gitleaks
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git rev-list --count --all
          /tmp/merismos-gitleaks/gitleaks git . --log-opts=--all --redact \
            --report-format=json --report-path=secrets-report.json
      - name: Report finding locations without secret values
        if: always()
        run: |
          if [ -f secrets-report.json ]; then
            jq '[.[] | {RuleID, File, StartLine, Commit, Fingerprint}]' secrets-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-history-secret-scan-${{ github.run_id }}
          path: secrets-report.json
          retention-days: 90
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ scripts/evaluate_interpretation.py scripts/collect_interpretation.py

      # The offline suite needs no AWS account and no credentials. That is the
      # claim the README makes to a judge, so CI runs it with none configured
      # rather than inheriting any that happen to exist.
      - name: Tests, with the coverage floor enforced
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: eu-west-1
        run: pytest -q

      - name: Source-only interpretation instrument, no model or network adapter
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: python scripts/evaluate_interpretation.py source-smoke --output evaluation-results

      - name: Retain every interpretation instrument attempt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interpretation-source-only-${{ github.sha }}-${{ github.run_id }}
          path: evaluation-results/
          retention-days: 90
          if-no-files-found: warn

      - name: Inert export and full fake collector to frozen replay (no AWS credentials)
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_EC2_METADATA_DISABLED: "true"
        run: python scripts/collect_interpretation.py source-smoke --output bounded-evaluation

      - name: Retain exact inert request sizes and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-evaluation-source-${{ github.sha }}-${{ github.run_id }}
          path: bounded-evaluation/
          retention-days: 90
          if-no-files-found: warn

      # A suite that skips is a claim nobody checked. The guard is the entry's
      # load-bearing control and its test is guarded by importorskip, so a CI
      # image without the SDK would turn the proof green by not running it.
      - name: The guard suite must run, not skip
        run: |
          pytest tests/integration/test_the_guard_is_a_control.py \
            -p no:cacheprovider --no-cov -q -rs > guard.txt 2>&1 || true
          cat guard.txt
          if grep -qiE "skipped|no tests ran" guard.txt; then
            echo "::error::the guard suite skipped. The load-bearing control is unproven."
            exit 1
          fi
          grep -q "3 passed" guard.txt || {
            echo "::error::expected 3 guard assertions, including the disabled-guard control"
            exit 1
          }

  # Absent a separately configured exact grant this job cannot obtain credentials.
  # Parent owns aggregate budget reservations and the one-shot manual dispatch.
  bounded-collection:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.eval_grant_sha256 != '' &&
      inputs.eval_grant_sha256 == vars.MERISMOS_EVAL_GRANT_SHA256
    needs: [secrets, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: aws
    concurrency:
      group: merismos-bounded-model-collection
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      MERISMOS_EVAL_GRANT_JSON: ${{ vars.MERISMOS_EVAL_GRANT_JSON }}
      MERISMOS_EVAL_GRANT_SHA256: ${{ vars.MERISMOS_EVAL_GRANT_SHA256 }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -e .
      - name: Refuse unbound or unaffordable grant BEFORE AWS credentials
        run: python scripts/collect_interpretation.py preflight --output bounded-live
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          retry-max-attempts: 1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow",
            "Action":"bedrock:InvokeModel","Resource":[
            "arn:aws:bedrock:eu-west-1:*:inference-profile/eu.anthropic.claude-opus-5",
            "arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-opus-5"]}]}
      - name: One reserved SDK attempt per frozen case; no retry or continuation
        run: python scripts/collect_interpretation.py collect --output bounded-live
      - name: Retain every request reservation, full raw response and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-live-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bounded-live/
          retention-days: 90
          if-no-files-found: warn

  # Proof the guard has teeth, run as its own job so the result is visible
  # rather than buried. The hook is removed and the same model must then reach
  # the tool. A gate nobody has watched go red is a gate nobody should believe.
  guard-has-teeth:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]"
      - name: With the guard removed, the write succeeds
        run: |
          pytest --no-cov -q \
            tests/integration/test_the_guard_is_a_control.py::test_the_same_demand_succeeds_with_the_guard_removed

      # The other ablation, and it answers a different question. The guard test
      # above proves the refusal is the guard. This proves the SDK is on the path
      # a stranger runs: it takes strands away and requires the end to end
      # journey to fail at a named assertion on the demo path. It exits 1 both
      # when the journey stays green and when it dies at collection, so a run
      # that never reached the demo path cannot be read as a pass.
      - name: With the SDK removed, the demo stops working
        run: python scripts/the_swap_test.py

  # The IaC is validated on every push. It is not applied here: an apply needs
  # credentials and creates real, billable resources, and a CI job that can
  # deploy on a push is a CI job that can deploy on somebody else's push.
  infra:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      # validate evaluates filebase64sha256 on the layer, so the artifact has to
      # exist before it runs. Building it here rather than stubbing it means the
      # build script is exercised on every push instead of only on a deploy,
      # which is where it would otherwise first fail.
      - name: Build the dependency layer
        run: infra/build.sh

      - name: Initialise without a backend or credentials
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

      # The layer has a hard 50 MB zipped limit and an apply that breaches it
      # fails after everything else has already been created.
      - name: The layer is inside the Lambda limit
        run: |
          set -euo pipefail
          bytes=$(stat -c%s infra/.build/deps.zip)
          echo "layer: ${bytes} bytes, $((bytes / 1048576)) MB"
          test "${bytes}" -lt 52428800 || {
            echo "::error::the layer is ${bytes} bytes, over the 50 MB zipped limit"
            exit 1
          }

      - name: Retain exact backend code package for separate deployment review
        uses: actions/upload-artifact@v4
        with:
          name: backend-code-${{ github.sha }}
          path: |
            infra/.build/backend.zip
            infra/.build/source/merismos/build-info.json
          retention-days: 90
          if-no-files-found: error

      # The layer cannot be built on Windows: pip resolves mcp's pywin32 marker
      # against the host interpreter even with --platform, and Git Bash has no
      # zip. So the artifact CI produces on Linux is the one a deploy uses,
      # which is the right way round anyway: the thing that ships is the thing
      # that was built by the pipeline rather than on somebody's laptop.
      - name: Publish the layer so a deploy uses this exact artifact
        uses: actions/upload-artifact@v4
        with:
          name: deps-layer
          path: infra/.build/deps.zip
          retention-days: 90
          if-no-files-found: error

      # The boundary this entry argues for lives in iam.tf, so it is linted as
      # policy rather than only as syntax.
      - name: The publish credential is granted to exactly one role
        run: |
          set -euo pipefail
          # Comments are stripped before counting. The first version of this
          # check did not, and the comment at the top of iam.tf explaining the
          # control named the action it describes, so the file's own
          # documentation failed the gate written to protect it. A check over
          # source text cannot tell a policy from a sentence about one, so it
          # has to be given only the policy.
          grep -v '^[[:space:]]*#' infra/iam.tf > /tmp/policy.tf
          grants=$(grep -c 'secretsmanager:GetSecretValue' /tmp/policy.tf || true)
          echo "GetSecretValue appears ${grants} times outside comments"
          # Once as the writer's grant, once in the shared Deny document.
          test "${grants}" -eq 2 || {
            echo "::error::GetSecretValue appears ${grants} times, expected 2."
            echo "::error::One grant (writer) and one deny (reader and evaluator)."
            exit 1
          }
          grep -q 'effect    = "Deny"' /tmp/policy.tf || {
            echo "::error::the explicit deny on the publish credential is gone"
            exit 1
          }
