name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The secret scan runs first and over history, not over the working tree. A
  # credential repaired in the tree but left in a commit is still published, and
  # the fix at that point is to rebuild the branch rather than to edit a file.
  # There is no ignore file, deliberately: allowlisting a pattern to make a
  # secret scan pass is how secret scanners stop working.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      # The offline suite needs no AWS account and no credentials. That is the
      # claim the README makes to a judge, so CI runs it with none configured
      # rather than inheriting any that happen to exist.
      - name: Tests, with the coverage floor enforced
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_DEFAULT_REGION: eu-west-1
        run: pytest -q

      # A suite that skips is a claim nobody checked. The guard is the entry's
      # load-bearing control and its test is guarded by importorskip, so a CI
      # image without the SDK would turn the proof green by not running it.
      - name: The guard suite must run, not skip
        run: |
          pytest tests/integration/test_the_guard_is_a_control.py \
            -p no:cacheprovider --no-cov -q -rs > guard.txt 2>&1 || true
          cat guard.txt
          if grep -qiE "skipped|no tests ran" guard.txt; then
            echo "::error::the guard suite skipped. The load-bearing control is unproven."
            exit 1
          fi
          grep -q "3 passed" guard.txt || {
            echo "::error::expected 3 guard assertions, including the disabled-guard control"
            exit 1
          }

  # Proof the guard has teeth, run as its own job so the result is visible
  # rather than buried. The hook is removed and the same model must then reach
  # the tool. A gate nobody has watched go red is a gate nobody should believe.
  guard-has-teeth:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]"
      - name: With the guard removed, the write succeeds
        run: |
          pytest --no-cov -q \
            tests/integration/test_the_guard_is_a_control.py::test_the_same_demand_succeeds_with_the_guard_removed

  # The IaC is validated on every push. It is not applied here: an apply needs
  # credentials and creates real, billable resources, and a CI job that can
  # deploy on a push is a CI job that can deploy on somebody else's push.
  infra:
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Formatting
        run: terraform -chdir=infra fmt -check -recursive -diff

      # validate evaluates filebase64sha256 on the layer, so the artifact has to
      # exist before it runs. Building it here rather than stubbing it means the
      # build script is exercised on every push instead of only on a deploy,
      # which is where it would otherwise first fail.
      - name: Build the dependency layer
        run: infra/build.sh

      - name: Initialise without a backend or credentials
        run: terraform -chdir=infra init -backend=false

      - name: Validate
        run: terraform -chdir=infra validate

      # The layer has a hard 50 MB zipped limit and an apply that breaches it
      # fails after everything else has already been created.
      - name: The layer is inside the Lambda limit
        run: |
          set -euo pipefail
          bytes=$(stat -c%s infra/.build/deps.zip)
          echo "layer: ${bytes} bytes, $((bytes / 1048576)) MB"
          test "${bytes}" -lt 52428800 || {
            echo "::error::the layer is ${bytes} bytes, over the 50 MB zipped limit"
            exit 1
          }

      # The boundary this entry argues for lives in iam.tf, so it is linted as
      # policy rather than only as syntax.
      - name: The publish credential is granted to exactly one role
        run: |
          set -euo pipefail
          # Comments are stripped before counting. The first version of this
          # check did not, and the comment at the top of iam.tf explaining the
          # control named the action it describes, so the file's own
          # documentation failed the gate written to protect it. A check over
          # source text cannot tell a policy from a sentence about one, so it
          # has to be given only the policy.
          grep -v '^[[:space:]]*#' infra/iam.tf > /tmp/policy.tf
          grants=$(grep -c 'secretsmanager:GetSecretValue' /tmp/policy.tf || true)
          echo "GetSecretValue appears ${grants} times outside comments"
          # Once as the writer's grant, once in the shared Deny document.
          test "${grants}" -eq 2 || {
            echo "::error::GetSecretValue appears ${grants} times, expected 2."
            echo "::error::One grant (writer) and one deny (reader and evaluator)."
            exit 1
          }
          grep -q 'effect    = "Deny"' /tmp/policy.tf || {
            echo "::error::the explicit deny on the publish credential is gone"
            exit 1
          }
