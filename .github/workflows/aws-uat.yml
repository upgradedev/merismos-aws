name: Live AWS acceptance
on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact frontend commit published by the caller
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA reported by the deployed release.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: merismos-live-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.receipt.outputs.artifact_name }}
      producer_run_id: ${{ steps.receipt.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.receipt.outputs.producer_run_attempt }}
    env:
      MERISMOS_UI_URL: https://d2qnkmlhs7y5fp.cloudfront.net/
      EXPECTED_RELEASE: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real AWS release before any synthetic action
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["EXPECTED_RELEASE"]), "Full release SHA required"'
          python infra/acceptance_receipt.py guard --sha "$EXPECTED_RELEASE"
          python infra/frontend_smoke.py --url "$MERISMOS_UI_URL" --sha "$EXPECTED_RELEASE" --output acceptance-proof/preflight.json
      - name: Install browser tools on CI only
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=low
          npx playwright install --with-deps chromium
      # Pinned to the two Chromium projects. The mobile-webkit project (Playwright WebKit,
      # not real-device Safari) runs in offline CI only until the owner decides otherwise.
      - name: Real CloudFront API and durable AWS workspace journeys
        id: journeys
        working-directory: frontend
        run: npm run test:e2e -- --forbid-only --project=desktop --project=mobile
      - name: Verify the tested release did not change during the journeys
        id: postflight
        if: always() && steps.journeys.outcome != 'skipped'
        run: python infra/frontend_smoke.py --url "$MERISMOS_UI_URL" --sha "$EXPECTED_RELEASE" --output acceptance-proof/postflight.json
      - name: Derive sanitized aggregate receipt from this run's JUnit
        id: receipt
        if: steps.preflight.outcome == 'success' && steps.journeys.outcome == 'success' && steps.postflight.outcome == 'success'
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: python infra/acceptance_receipt.py create --sha "$EXPECTED_RELEASE" --preflight acceptance-proof/preflight.json --postflight acceptance-proof/postflight.json
      - name: Summarize automated evidence without human signoff
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
          POSTFLIGHT: ${{ steps.postflight.outcome }}
        run: |
          printf '### Live AWS Playwright acceptance\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Frontend commit: %s\n\nPreflight: %s | Playwright: %s | Postflight: %s\n\n' "$EXPECTED_RELEASE" "$PREFLIGHT" "$JOURNEYS" "$POSTFLIGHT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Evidence: aws-acceptance-%s (HTML report, JUnit, traces, screenshots, testbook).\n\nHuman UAT: NOT_RUN. Backend deployments are managed separately.\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep observed results separate from human acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-acceptance-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/artifacts/browser-junit.xml
            frontend/playwright-report/
            frontend/UAT.testbook.*
            acceptance-proof/preflight.json
            acceptance-proof/postflight.json
          retention-days: 90
          if-no-files-found: error
      - name: Transfer only sanitized receipt to the publisher
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-proof/receipt.json
          retention-days: 90
          if-no-files-found: error
  publish-proof:
    needs: acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: merismos-frontend-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.acceptance.outputs.artifact_name }}
          path: acceptance-proof
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_RELEASE_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Publish immutable aggregate then latest for the still-deployed frontend
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE: ${{ inputs.release_sha }}
          PRODUCER_ARTIFACT: ${{ needs.acceptance.outputs.artifact_name }}
          PRODUCER_RUN_ID: ${{ needs.acceptance.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.acceptance.outputs.producer_run_attempt }}
        run: python infra/acceptance_receipt.py publish --sha "$EXPECTED_RELEASE"
  proof-browser:
    needs: [acceptance, publish-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MERISMOS_UI_URL: https://d2qnkmlhs7y5fp.cloudfront.net/
      EXPECTED_RELEASE: ${{ inputs.release_sha }}
      EXPECTED_PROOF_RUN: ${{ needs.acceptance.outputs.producer_run_id }}
      EXPECTED_PROOF_ATTEMPT: ${{ needs.acceptance.outputs.producer_run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install browser tools on CI only
        working-directory: frontend
        run: |
          npm install --global npm@11.19.1 --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=low
          npx playwright install --with-deps chromium
      - name: Read the actual rendered public proof without cloud credentials
        working-directory: frontend
        run: npm run test:proof -- public-proof.spec.ts --forbid-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-proof-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/proof-test-results/
            frontend/proof-playwright-report/
          retention-days: 90
          if-no-files-found: error
