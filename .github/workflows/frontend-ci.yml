name: Frontend verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      archive_previous_acceptance:
        description: Preserve the fixed previous accepted AWS artifact bytes once
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  archive-accepted-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_previous_acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Archive only the fixed accepted source artifact without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p accepted-evidence
          gh api repos/upgradedev/merismos-aws/actions/artifacts/10107806322 > accepted-evidence/source.json
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('accepted-evidence/source.json').read_text())
          assert source['id'] == 10107806322
          assert source['workflow_run']['id'] == 34360378251
          assert not source['expired'], 'The source has expired; no archive can be claimed'
          PY
          gh api repos/upgradedev/merismos-aws/actions/artifacts/10107806322/zip > accepted-evidence/original.zip
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('accepted-evidence')
          source = json.loads((root / 'source.json').read_text())
          manifest = {'source_run_id': 34360378251, 'source_artifact_id': 10107806322,
                      'source_commit': source['workflow_run']['head_sha'],
                      'source_name': source['name'], 'executed': False,
                      'sha256': hashlib.sha256((root / 'original.zip').read_bytes()).hexdigest()}
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-34360378251-source-10107806322-${{ github.run_id }}
          path: accepted-evidence/
          retention-days: 90
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: offline-suite-no-account
      AWS_SECRET_ACCESS_KEY: offline-suite-no-account
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-west-1
      MERISMOS_OFFLINE_HTTP: '1'
      MERISMOS_WORKSPACE_DB: /tmp/merismos-workspace.sqlite
      MERISMOS_CORPUS_ROOT: ${{ github.workspace }}/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Pin the CI dependency resolver
        run: npm install --global npm@11.19.1
      - name: Install Python dependencies in CI
        id: deps_python
        run: pip install -e '.[dev]'
      - name: Resolve frontend lock only if absent
        id: deps_node
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci
      - name: Preserve generated or committed lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lock
          path: frontend/package-lock.json
          retention-days: 90
          if-no-files-found: error
      - name: Audit all dependencies (high and critical findings block)
        if: ${{ !cancelled() && steps.deps_node.outcome == 'success' }}
        working-directory: frontend
        run: |
          mkdir -p test-results
          npm audit --audit-level=high --json > test-results/npm-audit-full.json
      - name: Strict production dependency audit
        if: ${{ !cancelled() && steps.deps_node.outcome == 'success' }}
        working-directory: frontend
        run: npm audit --omit=dev --json > test-results/npm-audit-production.json
      - name: Build the actual React application
        id: build
        if: ${{ !cancelled() && steps.deps_node.outcome == 'success' }}
        working-directory: frontend
        run: npm run build
      - name: Upload static build for review (deployment still requires all checks)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve dependency audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit
          path: frontend/test-results/npm-audit-*.json
          retention-days: 90
          if-no-files-found: error
      - name: Lint Python
        if: ${{ !cancelled() && steps.deps_python.outcome == 'success' }}
        run: ruff check src/ tests/
      - name: Existing Python regression and API functional tests
        if: ${{ !cancelled() && steps.deps_python.outcome == 'success' }}
        run: pytest -q --junitxml=frontend/test-results/python.xml --cov-report=xml:frontend/coverage-python.xml
      - name: Vitest and RTL with measured coverage floors
        if: ${{ !cancelled() && steps.deps_node.outcome == 'success' }}
        working-directory: frontend
        run: npm test
      - name: Install browser in CI
        id: browser
        if: ${{ !cancelled() && steps.deps_node.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real Python HTTP API and desktop/mobile journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/coverage/
            frontend/coverage-python.xml
            frontend/UAT.testbook.*
          retention-days: 90
      - name: Upload compact UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.sha }}
          path: frontend/test-results/**/*.png
          retention-days: 90
          if-no-files-found: warn
