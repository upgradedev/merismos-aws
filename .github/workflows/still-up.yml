name: The judges can still reach it

# Rules section 1 requires the project to be available to the Sponsor, the
# Administrator and the Judges, free of charge and without restriction, **until
# the judging period ends on 2026-10-08 17:00 PT**. That is 24 days past the
# submission deadline, and it is a rule rather than a nicety: an entry nobody can
# open during judging is an entry that was not submitted.
#
# "Re-curl it weekly" was written in a state file as an intention. This is the
# same sentence as a mechanism. It runs on a schedule, needs no credentials
# because it fetches only public pages anonymously, and it fails loudly.
#
# It exists because of what happened on 2026-09-05 and again on 2026-09-08. The
# site answered 503 to strangers for a stretch with no Lambda error and no alarm,
# and separately the approval card returned 503 after thirty seconds for three
# days. Both were found by somebody deciding to look. Nothing was watching.

on:
  schedule:
    # Twice a week, Monday and Thursday at 09:00 UTC. Often enough that an
    # outage is measured in days rather than in "whenever somebody next looked",
    # and rare enough that it is not noise.
    - cron: "0 9 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: still-up
  cancel-in-progress: false

jobs:
  reachable:
    runs-on: ubuntu-latest
    env:
      ROOT_URL: https://d2qnkmlhs7y5fp.cloudfront.net/
    steps:
      # Anonymous, on purpose. No AWS credentials, no OIDC, no token. If this
      # job needed a credential it would be checking something a judge cannot do.
      - name: The judge-facing CloudFront app is reachable
        run: |
          set -euo pipefail
          code=$(curl -sS -o root.html -m 30 -w '%{http_code}' "${ROOT_URL}")
          echo "GET / -> ${code}"
          test "${code}" = "200" || { echo "::error::the CloudFront app answered ${code}"; exit 1; }
          grep -q "Merismos" root.html || {
            echo "::error::200 with a body that is not a Merismos page. A CDN error page is still a 200"
            exit 1
          }

      - name: The deployed release manifest identifies the served app
        run: |
          set -euo pipefail
          code=$(curl -sS -o release.json -m 30 -w '%{http_code}' "${ROOT_URL}release.json")
          echo "GET /release.json -> ${code}"
          test "${code}" = "200" || { echo "::error::release.json answered ${code}"; exit 1; }
          commit=$(jq -er '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' release.json)
          grep -Fq "<meta name=\"application-commit\" content=\"${commit}\">" root.html || {
            echo "::error::the root HTML and release.json do not identify the same release"
            exit 1
          }

      - name: The anonymous acceptance evidence page is reachable
        run: |
          set -euo pipefail
          code=$(curl -sS -o acceptance.html -m 30 -w '%{http_code}' "${ROOT_URL}acceptance.html")
          echo "GET /acceptance.html -> ${code}"
          test "${code}" = "200" || { echo "::error::acceptance.html answered ${code}"; exit 1; }
          grep -q "MERISMOS / RELEASE EVIDENCE" acceptance.html || {
            echo "::error::200 with a body that is not the Merismos acceptance page"
            exit 1
          }

      # Unlike /identity, this route reads packaged metadata and makes no AWS
      # capability probe. It is safe to call from a scheduled reachability job.
      - name: The safe backend build-identity route is reachable
        run: |
          set -euo pipefail
          code=$(curl -sS -o backend-version.json -m 30 -w '%{http_code}' "${ROOT_URL}api/version")
          echo "GET /api/version -> ${code}"
          test "${code}" = "200" || { echo "::error::api/version answered ${code}"; exit 1; }
          jq -e '
            .schema_version == 1 and
            .application == "merismos" and
            .status == "known" and
            .source == "ci_package" and
            (.commit | type == "string" and test("^[0-9a-f]{40}$"))
          ' backend-version.json >/dev/null

      - name: Say so in the summary
        if: always()
        run: |
          {
            echo "### Reachability, ${ROOT_URL}"
            echo ""
            echo "Checked the CloudFront app, release manifest, acceptance page and safe backend version route"
            echo "anonymously, with no credentials. Judging ends 2026-10-08 17:00 PT."
          } >> "$GITHUB_STEP_SUMMARY"
