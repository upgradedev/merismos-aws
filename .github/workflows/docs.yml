name: Docs verification

# README.md and docs/ are the first pages a judge reads, and GitHub draws their
# diagrams in the reader's browser with its own copy of Mermaid. A block that
# does not parse shows an error where the architecture should be, and before
# this workflow nothing in CI read Markdown at all.
#
# This lints README.md and docs/**/*.md, checks the diagram rules that keep
# GitHub's light and dark themes readable, and renders every mermaid block in
# both themes with the Mermaid version pinned as GitHub's in
# .github/docs-lint/package.json. That pin records what GitHub served when its
# version was last read; CI cannot read GitHub's live version. Before a green
# render is trusted, a deliberately broken diagram must be refused with a parse
# error.
#
# Links and anchors are checked offline by tests/regression/test_the_docs_links_land.py
# in the CI test job instead, so a code change that moves a file a doc links to
# runs that check too.
#
# Nothing waits on this workflow: frontend-deploy.yml does not reference it. A
# merge to main still runs frontend-deploy.yml, as every push to main does.

on:
  pull_request:
    paths: ["README.md", "docs/**", ".markdownlint-cli2.jsonc", ".github/docs-lint/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["README.md", "docs/**", ".markdownlint-cli2.jsonc", ".github/docs-lint/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Pin the CI dependency resolver
        run: npm install --global npm@11.19.1

      # Exact pins, with mermaid forced to the version pinned as GitHub's, live
      # in .github/docs-lint/package.json, apart from frontend/ and its audits.
      - name: Resolve the docs tool lock only if absent
        id: tools
        working-directory: .github/docs-lint
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci

      - name: Preserve generated or committed lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-lint-lock-${{ github.run_id }}
          path: .github/docs-lint/package-lock.json
          include-hidden-files: true # the lock sits under .github/, which v4 skips by default
          retention-days: 90
          if-no-files-found: error

      - name: Markdown follows the repository lint rules
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: .github/docs-lint/node_modules/.bin/markdownlint-cli2 "README.md" "docs/**/*.md"

      # Plain Python, so it needs no tools and also runs locally.
      - name: Diagrams leave GitHub's light and dark themes in charge
        if: ${{ !cancelled() }}
        run: python .github/docs-lint/check_mermaid.py rules

      # ci.yml lints src/, tests/ and three scripts, not this directory.
      - name: The docs checker passes the repository's Ruff rules
        if: ${{ !cancelled() }}
        run: |
          python -m pip install "ruff>=0.6"
          ruff check .github/docs-lint/check_mermaid.py

      # Ubuntu 24.04 blocks the Chrome sandbox for browsers Puppeteer downloads.
      # aa-exec applies the chrome AppArmor profile and keeps the sandbox, as
      # mermaid-cli's own CI does. If the profile is missing, stop here rather
      # than render pull request content with --no-sandbox.
      - name: Chromium keeps its sandbox on this runner
        id: sandbox
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          command -v aa-exec >/dev/null || {
            echo "::error::aa-exec is not installed on this runner image"
            exit 1
          }
          aa-exec --profile=chrome true || {
            echo "::error::the chrome AppArmor profile is not available on this runner image"
            exit 1
          }

      - name: The Mermaid rendered here is the version pinned as GitHub's
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: aa-exec --profile=chrome python .github/docs-lint/check_mermaid.py version

      # A gate nobody has seen fail proves nothing. The sample is mermaid-cli's
      # own negative fixture. A browser that never starts also exits non-zero,
      # but without a parse error, and that is reported as a broken gate.
      - name: A deliberately broken diagram is refused for a parse error
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: aa-exec --profile=chrome python .github/docs-lint/check_mermaid.py canary

      - name: Every mermaid block renders in GitHub's light and dark themes
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: aa-exec --profile=chrome python .github/docs-lint/check_mermaid.py render --out "${RUNNER_TEMP}/mermaid"

      - name: Keep the rendered diagrams for review in both themes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-diagrams-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mermaid/
          retention-days: 90
          if-no-files-found: warn
